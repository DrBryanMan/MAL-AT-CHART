<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAL Charts History</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">

    <header class="site-header">
      <div class="container">
        <div class="header-brand">
          <span class="brand-icon">📊</span>
          <div>
            <h1 class="site-title">MAL<span class="accent">Charts</span></h1>
            <p class="site-subtitle">Архів рейтингів MyAnimeList</p>
          </div>
        </div>
        <nav class="header-nav">
          <a href="#section-chart">Знімки</a>
          <a href="#section-categories">Топ категорій</a>
          <a href="#section-events">Рекорди</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">

        <div id="loading" class="loading-screen">
          <div class="spinner"></div>
          <p>Завантаження даних…</p>
        </div>

        <div id="content" class="hidden">

          <!-- ═══ SECTION 1: Snapshot Chart ═══ -->
          <section class="section" id="section-chart">
            <div class="section-header">
              <h2 class="section-title">
                <span>📋 Рейтинг на дату</span>
                <button class="info-btn" data-info-key="chart" aria-label="Інформація">ℹ</button>
              </h2>
              <div class="snapshot-nav" id="snapshot-nav"></div>
            </div>
            <div id="top-rated-content"></div>
          </section>

          <!-- ═══ SECTION 2: Category Top History ═══ -->
          <section class="section" id="section-categories">
            <div class="section-header">
              <h2 class="section-title">
                <span>🏷️ Топ-1 за категоріями (з оцінкою ≥ 9.0)</span>
                <button class="info-btn" data-info-key="categories" aria-label="Інформація">ℹ</button>
              </h2>
            </div>
            <div id="categories-content"></div>
          </section>

          <!-- ═══ SECTION 3: Notable Events ═══ -->
          <section class="section" id="section-events">
            <div class="section-header">
              <h2 class="section-title">
                <span>🏆 Визначні події та рекорди</span>
                <button class="info-btn" data-info-key="events" aria-label="Інформація">ℹ</button>
              </h2>
            </div>
            <div id="events-content"></div>
          </section>

        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>Дані: MyAnimeList (Wayback Machine архів)</span>
      </div>
    </footer>

  </div>

  <div class="tooltip-popup" id="tooltip-popup" role="tooltip" aria-hidden="true"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
