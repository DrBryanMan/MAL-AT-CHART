<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAL Ratings Chart</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='10' width='4' height='12' rx='1' fill='%2358a6ff'/><rect x='10' y='4' width='4' height='18' rx='1' fill='%2358a6ff' opacity='.85'/><rect x='18' y='7' width='4' height='15' rx='1' fill='%2358a6ff' opacity='.65'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="maintenance.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ═══ MAINTENANCE SCREEN ═══ -->
  <div id="maintenance-screen" aria-live="polite">
    <div class="maint-bg"></div>
    <div class="maint-grid"></div>
    <div class="maint-body">
      <div class="maint-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
          <path d="M12 8v4l3 3"/>
          <path d="M3.05 11a9 9 0 0 1 .49-2.07"/>
          <path d="M20.46 11a9 9 0 0 0-.49-2.07"/>
        </svg>
      </div>
      <div class="maint-badge">
        <span class="maint-badge-dot"></span>
        Технічні роботи
      </div>
      <h1 class="maint-title">Сайт на оновленні</h1>
      <hr class="maint-divider">
    </div>
    <p class="maint-footer">
      MAL <strong>Ratings Chart</strong> &nbsp;·&nbsp; Архів рейтинґів MyAnimeList
    </p>
  </div>
  <div id="app">
    <header class="site-header">
      <div class="container">
        <div class="header-brand">
          <span class="brand-icon"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg></span>
          <div>
            <h1 class="site-title">MAL <span class="accent">Ratings Chart</span></h1>
            <p class="site-subtitle">Архів рейтинґів MyAnimeList</p>
          </div>
        </div>
        <nav class="header-nav">
          <a href="#section-chart">Знімки</a>
          <a href="#section-categories">ТОП категорій</a>
          <a href="#section-events">Рекорди</a>
          <button class="theme-toggle" id="theme-toggle" aria-label="Змінити тему"></button>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">

        <div id="loading" class="loading-screen">
          <div class="spinner"></div>
          <p>Завантаження даних…</p>
        </div>

        <div id="content" class="hidden">

          <!-- ═══ SECTION 1: Snapshot Chart ═══ -->
          <section class="section" id="section-chart">
            <div class="section-header">
              <h2 class="section-title">
                <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg> Щоденний рейтинґ</span>
                <button class="info-btn" data-info-key="chart" aria-label="Інформація"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
              </h2>
              <div class="snapshot-nav" id="snapshot-nav"></div>
            </div>
            <div id="top-rated-content"></div>
          </section>

          <!-- ═══ SECTION 2: Category Top History ═══ -->
          <section class="section" id="section-categories">
            <div class="section-header">
              <h2 class="section-title">
                <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg> Чергування ТОП-1</span>
                <button class="info-btn" data-info-key="categories" aria-label="Інформація"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
              </h2>
            </div>
            <div id="categories-content"></div>
          </section>

          <!-- ═══ SECTION 3: Notable Events ═══ -->
          <section class="section" id="section-events">
            <div class="section-header">
              <h2 class="section-title">
                <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg> Визначні події та рекорди</span>
                <button class="info-btn" data-info-key="events" aria-label="Інформація"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
              </h2>
            </div>
            <div id="events-content"></div>
          </section>

        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>Дані: MyAnimeList (Wayback Machine архів)</span>
      </div>
    </footer>

  </div>

  <div class="tooltip-popup" id="tooltip-popup" role="tooltip" aria-hidden="true"></div>
  <script>
    // const MAINTENANCE = true;
    const MAINTENANCE = false;
    if (MAINTENANCE) {
      document.getElementById('maintenance-screen').classList.add('active');
    } else {
      const s = document.createElement('script');
      s.type = 'module';
      s.src  = 'js/main.js';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
